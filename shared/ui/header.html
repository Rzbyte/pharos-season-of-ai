<header class="shell">
  <div class="rail shell-bar">
    <a class="shell-home" data-lab-home><span class="brand-mark" aria-hidden="true"></span><span><b>Pharos</b> <span class="when-wide">Agent </span>Lab</span></a>
    <nav class="shell-tasks" aria-label="Tasks">
      <span class="shell-step" data-task-step="previous" role="img" aria-label="Previous task" aria-disabled="true"></span>
      <span class="shell-count" data-task-count><span class="sr">Task </span><b>{{n}}</b> / 30</span>
      <span class="shell-step" data-task-step="next" role="img" aria-label="Next task" aria-disabled="true"></span>
    </nav>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch theme">
      <span class="theme-icons" aria-hidden="true">
        <svg class="when-dark" viewBox="0 0 16 16" focusable="false"><circle cx="8" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.25v1.5M8 13.25v1.5M1.25 8h1.5M13.25 8h1.5M3.2 3.2l1.06 1.06M11.74 11.74l1.06 1.06M3.2 12.8l1.06-1.06M11.74 4.26l1.06-1.06" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <svg class="when-light" viewBox="0 0 16 16" focusable="false"><path d="M13.5 9.6A5.75 5.75 0 0 1 6.4 2.5a5.75 5.75 0 1 0 7.1 7.1Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
      </span>
    </button>
  </div>
</header>
